{% set flash_styles = {
  'success': 'bg-green-100 text-green-900',
  'warning': 'bg-yellow-100 text-yellow-900',
  'danger': 'bg-red-100 text-red-900'
} %}
<header>
  <nav class="bg-gray-900 text-white">
    <div class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-2.5">
      <a href="{{ url_for('index') }}" class="font-medium">Анализатор страниц</a>
      <a href="{{ url_for('urls_index') }}" class="text-sm text-gray-400 hover:text-white">Сайты</a>
    </div>
  </nav>
  {% for message in get_flashed_messages(request) %}
    <div role="alert" class="px-4 py-2.5 text-sm {{ flash_styles[message.category] }}">{{ message.message }}</div>
  {% endfor %}
</header>
