{% extends 'base.html' %}

{% block content %}
<div class="mx-auto max-w-3xl px-4 py-12">
  <div class="rounded-2xl border border-gray-200 bg-gray-50 px-8 py-10">
    <h1 class="text-5xl">Анализатор страниц</h1>
    <p class="mt-2 mb-6 text-sm text-gray-600">Бесплатно проверяйте сайты на SEO-пригодность</p>
    <form action="{{ url_for('urls_create') }}" method="post" class="flex justify-center gap-3">
      <label for="text" class="sr-only">Url для проверки</label>
      <input type="text" name="url" placeholder="https://www.example.com"
             value="{{ url | default('', true) }}" class="w-full rounded text-lg" required="">
      <input type="submit" class="cursor-pointer rounded bg-blue-600 px-8 py-2 text-lg font-medium text-white uppercase hover:bg-blue-700"
             value="Проверить">
    </form>
  </div>
</div>
{% endblock %}
