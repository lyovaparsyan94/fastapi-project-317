services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: page_analyzer
      POSTGRES_PASSWORD: page_analyzer
      POSTGRES_DB: page_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U page_analyzer -d page_analyzer"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://page_analyzer:page_analyzer@db:5432/page_analyzer
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "make migrate && make start"

volumes:
  pgdata:
